spring.application.name=cosmo-cats
server.port=8080

# MySQL (credentials come from environment variables, never from the repository)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/store_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Liquibase, Hibernate only maps it
spring.liquibase.change-log=classpath:db/changelog/master-change-log.yaml
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 3rd-party delivery service (WireMock stub from docker-compose)
delivery.base-url=http://localhost:8081
