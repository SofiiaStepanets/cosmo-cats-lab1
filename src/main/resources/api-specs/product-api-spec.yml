openapi: 3.0.3

info:
  title: Cosmo Cats Products API
  description: CRUD API for products of the Cosmo Cats Intergalactic Marketplace.
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Products

paths:
  /api/v1/products:
    get:
      summary: Get a page of products
      operationId: getAllProducts
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of products (empty "content" if there are none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a new product
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product was created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Get product by ID
      operationId: getProductById
      tags: [Products]
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Update product
      description: Full update. "id" from the body is ignored, the path id is used.
      operationId: updateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete product
      operationId: deleteProduct
      tags: [Products]
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: ID of the product
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    Product:
      type: object
      required: [name, price, category]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Generated by the server, ignored in requests
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: Must contain a cosmic word (star, galaxy or comet), case-insensitive
          example: Star Tuna
        description:
          type: string
          minLength: 10
          maxLength: 100
          example: Freeze-dried tuna for cats in orbit
        price:
          type: number
          minimum: 10.00
          multipleOf: 0.01
          description: Price with at most 8 integer and 2 fraction digits (BigDecimal on the server)
          example: 19.99
        category:
          type: string
          maxLength: 50
          description: Name of an existing category
          example: Food
        inStock:
          type: boolean
          default: false
          example: true

    ProductPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 42

    ProblemDetail:
      description: Error response according to RFC 9457
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Field 'price' must be greater than or equal to 10.00
        instance:
          type: string
          format: uri-reference
          example: /api/v1/products

  responses:
    BadRequest:
      description: Validation failed or request is malformed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Product or category was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://cosmo-cats.market/errors/not-found
            title: Resource not found
            status: 404
            detail: Product with id 42 not found.
            instance: /api/v1/products/42
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
